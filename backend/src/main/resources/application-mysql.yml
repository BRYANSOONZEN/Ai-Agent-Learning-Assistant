# 用 MySQL 跑后端（启动时加 --spring.profiles.active=mysql，或 mvnw spring-boot:run -Dspring-boot.run.profiles=mysql）。
# 本机 MySQL 8.4：只监听 127.0.0.1:3306，库 se_platform（utf8mb4），账号 se_app 只有这个库的权限。
# 密码不写在这里：优先读环境变量 MYSQL_PASSWORD，没有就读 application-local.yml 里的 platform-local.mysql-password。
# 建表、演示数据和 H2 用的是同一份 schema.sql / data.sql（写法两边都兼容）；库是空的才执行，之后只补新表、新列（KeepDataConfig）。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/se_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: se_app
    password: ${MYSQL_PASSWORD:${platform-local.mysql-password:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  h2:
    console:
      enabled: false
